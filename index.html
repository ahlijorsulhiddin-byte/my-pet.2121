<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:radial-gradient(900px 500px at 50% -10%,#2b1f5c,#0f0f2e 70%) #0f0f2e;color:var(--tx);font:500 16px/1.3 system-ui,'Segoe UI',sans-serif;min-height:100vh}
#app{max-width:440px;margin:0 auto;padding:10px 12px 84px}
.gl{background:var(--gl);backdrop-filter:blur(10px);border:1px solid var(--gb);border-radius:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin-bottom:10px}
#co{color:var(--am);font-weight:700;font-size:18px}
button{font:inherit;color:var(--tx);cursor:pointer;border-radius:12px;background:rgba(94,231,223,.14);border:1px solid rgba(94,231,223,.45);padding:9px 12px;min-height:44px;transition:transform .12s,background .2s}
button:hover:not(:disabled){background:rgba(94,231,223,.3)}button:active:not(:disabled){transform:scale(.95)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
#scene{position:relative;height:290px;border-radius:18px;overflow:hidden;background:linear-gradient(#3b3a8f 0 64%,#f0e2cf 64%);border:1px solid var(--gb)}
.sl{position:absolute;font-size:44px;line-height:1;text-align:center;width:60px}
#pet{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);animation:bob 2.4s ease-in-out infinite;cursor:pointer;user-select:none}
#pet svg{display:block}#pet .ey{animation:bl 4s infinite;transform-origin:center;transform-box:fill-box}#pet .tl{animation:wg 1.4s ease-in-out infinite;transform-origin:0 100%;transform-box:fill-box}#pet.z{animation:none;filter:brightness(.65)}#pet.z .ey{animation:none;transform:scaleY(.08)}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes wg{50%{transform:rotate(14deg)}}#pet.j{animation:jump .5s}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}@keyframes jump{40%{transform:translateX(-50%) translateY(-40px)}}
#bub{position:absolute;left:58%;top:70px;background:#fff;color:#2b1f5c;padding:5px 11px;border-radius:14px;font-weight:700;font-size:14px}
.nd{margin:10px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:10px 12px;font-size:13px}
.nd i{display:block;height:7px;border-radius:7px;background:rgba(255,255,255,.14);margin-top:3px;overflow:hidden}.nd b{display:block;height:100%;background:var(--cy);transition:width .4s}.nd .lo b{background:var(--pk)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-top:10px}.acts button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:8px 2px}.acts span{font-size:22px}
.tabs{display:flex;gap:8px;margin-bottom:10px}#rooms button{flex:none;white-space:nowrap}.tabs button{flex:1}.tabs .on,nav .on{background:var(--lav);color:#2b1f5c;border-color:var(--lav)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.card .e{font-size:44px;line-height:1.1}.card small{color:var(--mu)}.card em{font-style:normal;color:var(--am);font-weight:700}.card button{margin-top:auto}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(416px,94vw);display:flex;gap:6px;padding:6px;z-index:5}nav button{flex:1;background:transparent;border-color:transparent}
#cw{position:relative}canvas{display:block;width:100%;border-radius:14px;background:#161445;touch-action:none;border:1px solid var(--gb)}
.gb{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.gb b{flex:1;text-align:center}
#ov{position:absolute;inset:0;border-radius:14px;background:rgba(15,15,46,.85);display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.hint{color:var(--mu);font-size:13px;margin-top:8px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#ot{white-space:pre-line}.fx{position:absolute;bottom:150px;font-size:28px;pointer-events:none;animation:fl 1.4s ease-out forwards}@keyframes fl{to{transform:translateY(-90px);opacity:0}}#pet,#hat{transition:left 1.6s ease-in-out}#pet svg{transition:transform .25s}
</style></head><body>
<div id="app">
<header class="gl"><b id="pn"></b><span id="lvl" style="color:var(--lav)"></span><span>🪙 <span id="co"></span></span><button id="sb" aria-label="Звук" style="min-height:36px;padding:2px 10px"></button></header>

</div>
